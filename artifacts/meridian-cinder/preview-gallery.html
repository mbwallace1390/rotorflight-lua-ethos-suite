<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian &amp; Cinder — MWRC</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#111318;color:#eef2f5;font:16px Arial,sans-serif}
main{max-width:1100px;margin:auto}h1{font-size:26px;font-weight:500;margin:0 0 8px}p{color:#b4bdc8;line-height:1.5}
.controls{display:flex;flex-wrap:wrap;align-items:end;gap:14px;margin:24px 0 18px}
label{display:grid;gap:7px;font-size:13px;color:#bac6d2}select{font:16px Arial;padding:10px 32px 10px 12px;background:#1a2029;color:#f4f6f9;border:1px solid #485666;border-radius:6px}
select:focus-visible{outline:2px solid #8ddcec;outline-offset:3px}
figure{margin:0;padding:12px;border:1px solid #414954;background:#080a0e;border-radius:8px}
img{display:block;max-width:100%;height:auto;margin:auto}figcaption{color:#b4bdc8;font-size:13px;text-align:center;margin-top:12px}
.note{font-size:13px;color:#a5afbd;margin-top:18px}a{color:#a9d6ec}
</style>
<main><h1>Meridian &amp; Cinder</h1><p>Two new Rotorflight themes. Explore each screen and display size.</p>
<div class="controls">
<label>Theme<select id="theme"><option value="meridian">Meridian</option><option value="cinder">Cinder</option></select></label>
<label>Screen<select id="phase"><option value="preflight">Preflight</option><option value="inflight" selected>Inflight</option><option value="postflight">Postflight</option></select></label>
<label>Display<select id="size"><option value="800x480">Full screen · 800 × 480</option><option value="784x294">Compact widget · 784 × 294</option></select></label>
<label>Radio appearance<select id="mode"><option value="dark26">ETHOS 26 · Dark</option><option value="light26">ETHOS 26 · Light</option><option value="dark16">ETHOS 1.6 · Dark</option></select></label>
</div><figure><img id="screen" width="800" height="480" alt="Meridian inflight dashboard"><figcaption id="caption"></figcaption></figure>
<p class="note">Rendered from the implemented themes. Desktop fonts approximate the radio. MY HELI is sample model data; the radio uses your selected model. RPM has no fixed limit or redline.</p>
</main><script>
const images={"meridian-preflight-800x480-dark26": "renders/meridian-preflight-800x480-dark26.png", "meridian-preflight-800x480-light26": "renders/meridian-preflight-800x480-light26.png", "meridian-preflight-800x480-dark16": "renders/meridian-preflight-800x480-dark16.png", "meridian-preflight-784x294-dark26": "renders/meridian-preflight-784x294-dark26.png", "meridian-preflight-784x294-light26": "renders/meridian-preflight-784x294-light26.png", "meridian-preflight-784x294-dark16": "renders/meridian-preflight-784x294-dark16.png", "meridian-inflight-800x480-dark26": "renders/meridian-inflight-800x480-dark26.png", "meridian-inflight-800x480-light26": "renders/meridian-inflight-800x480-light26.png", "meridian-inflight-800x480-dark16": "renders/meridian-inflight-800x480-dark16.png", "meridian-inflight-784x294-dark26": "renders/meridian-inflight-784x294-dark26.png", "meridian-inflight-784x294-light26": "renders/meridian-inflight-784x294-light26.png", "meridian-inflight-784x294-dark16": "renders/meridian-inflight-784x294-dark16.png", "meridian-postflight-800x480-dark26": "renders/meridian-postflight-800x480-dark26.png", "meridian-postflight-800x480-light26": "renders/meridian-postflight-800x480-light26.png", "meridian-postflight-800x480-dark16": "renders/meridian-postflight-800x480-dark16.png", "meridian-postflight-784x294-dark26": "renders/meridian-postflight-784x294-dark26.png", "meridian-postflight-784x294-light26": "renders/meridian-postflight-784x294-light26.png", "meridian-postflight-784x294-dark16": "renders/meridian-postflight-784x294-dark16.png", "cinder-preflight-800x480-dark26": "renders/cinder-preflight-800x480-dark26.png", "cinder-preflight-800x480-light26": "renders/cinder-preflight-800x480-light26.png", "cinder-preflight-800x480-dark16": "renders/cinder-preflight-800x480-dark16.png", "cinder-preflight-784x294-dark26": "renders/cinder-preflight-784x294-dark26.png", "cinder-preflight-784x294-light26": "renders/cinder-preflight-784x294-light26.png", "cinder-preflight-784x294-dark16": "renders/cinder-preflight-784x294-dark16.png", "cinder-inflight-800x480-dark26": "renders/cinder-inflight-800x480-dark26.png", "cinder-inflight-800x480-light26": "renders/cinder-inflight-800x480-light26.png", "cinder-inflight-800x480-dark16": "renders/cinder-inflight-800x480-dark16.png", "cinder-inflight-784x294-dark26": "renders/cinder-inflight-784x294-dark26.png", "cinder-inflight-784x294-light26": "renders/cinder-inflight-784x294-light26.png", "cinder-inflight-784x294-dark16": "renders/cinder-inflight-784x294-dark16.png", "cinder-postflight-800x480-dark26": "renders/cinder-postflight-800x480-dark26.png", "cinder-postflight-800x480-light26": "renders/cinder-postflight-800x480-light26.png", "cinder-postflight-800x480-dark16": "renders/cinder-postflight-800x480-dark16.png", "cinder-postflight-784x294-dark26": "renders/cinder-postflight-784x294-dark26.png", "cinder-postflight-784x294-light26": "renders/cinder-postflight-784x294-light26.png", "cinder-postflight-784x294-dark16": "renders/cinder-postflight-784x294-dark16.png"}, controls=['theme','phase','size','mode'].map(id=>document.getElementById(id));
function show(){const [theme,phase,size,mode]=controls.map(el=>el.value),image=document.getElementById('screen');
image.src=images[[theme,phase,size,mode].join('-')]; const [width,height]=size.split('x').map(Number);image.width=width;image.height=height;
image.alt=theme+' '+phase+' dashboard';document.getElementById('caption').textContent=controls.map(el=>el.selectedOptions[0].textContent).join(' · ');}
controls.forEach(el=>el.addEventListener('change',show));show();
</script></html>
